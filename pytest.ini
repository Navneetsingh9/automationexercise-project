[pytest]
minversion = 6.0

# Default options - reduced verbosity
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --maxfail=5
    --no-header

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Smoke tests
    regression: Regression tests
    sanity: Sanity tests
    login: Login tests
    registration: Registration tests
    products: Product tests
    cart: Cart tests
    checkout: Checkout tests

# Logging - reduce verbosity
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s
log_cli_date_format = %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Filter out noisy logs
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning